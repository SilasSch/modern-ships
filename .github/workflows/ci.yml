name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Run tests
        run: tools/run_tests.sh

  export:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$dir"
          unzip -q -j templates.tpz templates/version.txt templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            templates/windows_release_arm64.exe templates/windows_debug_arm64.exe templates/windows_release_arm64_console.exe -d "$dir"
          rm templates.tpz
      - name: Export
        run: |
          mkdir -p build/windows-arm64 build/linux-x86_64
          cd game
          godot --headless --import || true
          godot --headless --export-release "Windows ARM64" ../build/windows-arm64/ModernShips.exe
          godot --headless --export-release "Linux x86_64" ../build/linux-x86_64/ModernShips.x86_64
          test -s ../build/windows-arm64/ModernShips.exe
          test -s ../build/linux-x86_64/ModernShips.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: modern-ships-windows-arm64
          path: build/windows-arm64/
      - uses: actions/upload-artifact@v4
        with:
          name: modern-ships-linux-x86_64
          path: build/linux-x86_64/
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build && zip -qr ../modern-ships-windows-arm64.zip windows-arm64 && tar -czf ../modern-ships-linux-x86_64.tar.gz linux-x86_64)
          gh release create "$GITHUB_REF_NAME" modern-ships-windows-arm64.zip modern-ships-linux-x86_64.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
